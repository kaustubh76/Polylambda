# CI test-gate — runs the Python + frontend suites on every push and PR to main. There was no CI
# before this, so a red build could autodeploy. NOTE: Render autoDeploy is independent of this workflow
# — this is the regression / PR gate; wiring deploy-on-green is a later Render-config change (turn off
# autoDeploy + add a deploy hook on CI success). The legacy Envio indexer's test needs `envio codegen`
# (not reliably runnable headless) — run `cd indexer && npm test` locally; it's dormant/optional.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # replicate the Dockerfile's offline-cache step (Dockerfile:36) so the backend tests see the same
      # committed artifacts the deployed image does — else the fresh-checkout .data_cache is empty and
      # the hazard/recon/scoring endpoints degrade (3 tests fail that pass in the built image).
      - run: mkdir -p .data_cache && cp -r webapp/deploy/cache/. .data_cache/
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
